name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: PMA_DATABASE_URL=sqlite:///ci.db alembic upgrade head
      - name: Tests (end-to-end over real MPXJ parsing)
        run: python -m pytest tests -q -p no:faulthandler

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build   # vue-tsc strict type-check + production build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { context: backend, push: true, tags: 'ghcr.io/${{ github.repository }}/pma-backend:${{ github.sha }}' }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: true, tags: 'ghcr.io/${{ github.repository }}/pma-frontend:${{ github.sha }}' }
